[project]
name = "life-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Life Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "pyjwt>=2.10.0",
    "pywebpush>=2.0.0",
    "anthropic>=0.119.0",
    "google-genai>=2.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: don't fight the generator's formatting.
"alembic/versions/*" = ["E501"]
# The extraction prompt embeds few-shot JSON examples whose readability matters
# more than an 80-char limit; the example lines can't carry a noqa mid-string.
"app/services/follow_up_extraction.py" = ["E501"]
"app/services/tag_suggestion.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
